name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 语法级静态检查
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 app tests

      - name: 运行测试（联网 golden 默认跳过）
        run: python -m pytest -q
